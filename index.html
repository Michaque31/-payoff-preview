<div id="payoffBootSplash" role="status" aria-label="Payoff a carregar">
  <div class="boot-emblem">
    <span class="boot-orbit" aria-hidden="true"></span>
    <img class="boot-mark" src="payoff-symbol.svg" alt="">
  </div>

<script>
window.__payoffBootStartedAt=Date.now();
window.setTimeout(function(){
  var splash=document.getElementById('payoffBootSplash');

rashEmpty:'A lixeira está vazia.',restore:'Restaurar',deleteForever:'Apagar definitivamente',deleteForeverConfirm:'Apagar este registo definitivamente?',releaseSummary:'• Privacidade configurável: ocultar apenas “Eu devo”, “Devem-me” e saldo líquido, ou ocultar todos os dados dos registos.\n• Fecho mais fiável dos menus dos três pontos ao tocar fora dos cartões.\n• Botão WhatsApp/SMS corrigido: expande com um toque, fecha corretamente e mantém apenas um menu aberto de cada vez.\n• Novidades da atualização apresentadas em lista organizada, mesmo quando a publicação só fornece a ligação “Full Changelog”.\n• Lixeira em ecrã completo, com gestão do prazo de eliminação no próprio ecrã.\n• Escolha de contactos diretamente na agenda do Android, com pedido de permissão.\n• Botão único para expandir as opções WhatsApp e SMS e preparar lembretes.\n• Opção de desfazer alterações a registos e pagamentos.\n• Guia de utilização mais completo nas Definições.\n• Melhorias gerais de navegação e estabilidade.',guideTitle:'Guia de utilização',guideOpen:'Abrir guia de utilização',guide1Title:'1. Criar um registo',guide1Text:'Toque em “+ Novo registo” e escolha primeiro se é um valor que deve ou que lhe devem. Preencha o nome, telefone (se aplicável), valor total, data e data limite. A nota ajuda a identificar o motivo, por exemplo “Empréstimo para investimento”. Escolha também a prioridade para destacar os compromissos mais importantes.',guide2Title:'2. Registar pagamentos',guide2Text:'No cartão da pessoa, toque em “Registar pagamento”. Indique o montante recebido ou pago e confirme a data. Pode registar vários pagamentos parciais: a barra de progresso, o total já pago e o valor em falta são recalculados automaticamente. Abra “Histórico” para consultar ou corrigir pagamentos anteriores.',guide3Title:'3. Corrigir informações',guide3Text:'Use o botão de três pontos no cartão para editar os dados ou apagar o registo. Para corrigir um pagamento, abra “Histórico” e toque em “Editar” junto ao movimento. Depois de guardar uma edição, aparece temporariamente a opção “Desfazer”, caso tenha alterado algo por engano.',guide4Title:'4. Lembretes',guide4Text:'Em qualquer cartão, toque no botão com o ícone de dois balões. O botão abre duas opções: WhatsApp e SMS. Ao escolher um contacto, o Android pode pedir autorização para aceder aos contactos; permita o acesso para abrir a agenda e selecionar o número. O nome e o telefone são preenchidos automaticamente no formulário e ficam guardados nesse registo. Se não quiser conceder a permissão, pode escrever o número manualmente. Ao tocar em WhatsApp ou SMS, o Payoff abre a aplicação correspondente com o número e uma mensagem preparada com o nome e o saldo em falta. Confirme o texto e toque em enviar dentro da aplicação. O Payoff não envia mensagens sem a sua confirmação.',guide5Title:'5. Lixeira',guide5Text:'Abra as Definições e entre em “Lixeira”. Os registos apagados ficam guardados durante o prazo escolhido (7, 15 ou 30 dias). Pode restaurar um registo para a lista principal ou apagá-lo definitivamente. A eliminação automática é gerida dentro da própria Lixeira.',guide6Title:'6. Cópias de segurança e atualizações',guide6Text:'Em “Cópia de segurança”, exporte regularmente um ficheiro e guarde-o num local seguro. Para recuperar dados, use “Importar”. Antes de instalar uma atualização, consulte as notas apresentadas nas Definições. Evite apagar os dados da aplicação sem ter uma cópia atualizada.',guide7Title:'7. Ocultar as contas em público',guide7Text:'Abra as Definições e procure “Privacidade das contas”. Ative “Abrir a aplicação com as contas ocultas” para que, sempre que iniciar o Payoff, os nomes das pessoas, os valores, os pagamentos e o saldo líquido apareçam desfocados. Quando estiver num local privado, toque no botão do olho no topo do ecrã para mostrar temporariamente os dados. Toque novamente para os ocultar. Esta opção protege a visualização no ecrã, mas não substitui o bloqueio por PIN nem encripta os da /* updates */
function compareVersions(a,b){var aa=String(a||'').replace(/^v/,'').split('.').map(Number),bb=String(b||'').replace(/^v/,'').split('.').map(Number);for(var i=0;i<Math.max(aa.length,bb.length);i++){var d=(aa[i]||0)-(bb[i]||0);if(d)return d>0?1:-1}return 0}
var chkd=false,updateCheckPromise=null;
function normalizeReleaseVersion(tag){
 var raw=String(tag||'').replace(/^v/i,'').replace(/n$/i,'');
 var legacy=raw.match(/^1\.(\d{3})$/);
 if(legacy){var d=legacy[1];return '1.'+Number(d[0])+'.'+Number(d[1])+'.'+Number(d[2])}
 return raw;
}
function uiUpd(){
 $('#gear').classList.toggle('dot',upd);
 $('#doUpd').style.display=upd?'':'none';
 $('#uT').textContent=!chkd?'':(upd?t('upd')+' (v'+NV+')':t('ok'));var nb=$('#toggleReleaseNotes'),np=$('#releaseNotes');if(nb&&np){var has=!!(upd&&NVNotes&&NVNotes.trim());nb.style.display=has?'':'none';if(!has){nb.textContent=t('showNotes');nb.setAttribute('aria-expanded','false');np.classList.remove('on');np.textContent=''}else if(!np.classList.contains('on'))nb.textContent=t('showNotes')}
}
function chk(){
 var b=$('#chk');
 if(updateCheckPromise)return updateCheckPromise;
 if(b){b.disabled=true;b.classList.add('loading')}
 updateCheckPromise=fetch('https://api.github.com/repos/Michaque31/Playoff--Releases/releases/latest',{headers:{Accept:'application/vnd.github+json'},cache:'no-store'})
  .then(function(r){if(!r.ok)throw new Error('GitHub HTTP '+r.status);return r.json()})
  .then(function(rel){
   if(!rel||rel.draft||rel.prerelease||!rel.tag_name)throw new Error('Release estável não encontrada');
   var version=normalizeReleaseVersion(rel.tag_name);
   if(!/^\d+(?:\.\d+){2,3}$/.test(version))throw new Error('Versão publicada inválida: '+version);
   NV=version;var releaseBody=String(rel.body||'').trim();var meaningfulNotes=releaseBody.replace(/\*\*?Full Changelog\*\*?:?\s*https?:\/\/\S+/ig,'').replace(/https?:\/\/\S+/g,'').replace(/[\s*#>-]/g,'').trim();NVNotes=meaningfulNotes?releaseBody.replace(/\*\*?Full Changelog\*\*?:?\s*https?:\/\/\S+/ig,'').trim():t('releaseSummary');if(!NVNotes)NVNotes=t('releaseSummary');chkd=true;upd=compareVersions(NV,V)>0;uiUpd();
   try{localStorage.setItem('dv_release_check_cache',JSON.stringify({version:NV,checkedAt:Date.now(),tag:rel.tag_name}))}catch(e){}
   try{localStorage.removeItem('dv_update_available_version')}catch(e){}
  })
  .catch(function(err){
   console.warn('Verificação de atualizações Payoff:',err);
   var cached=null;
   try{cached=JSON.parse(localStorage.getItem('dv_release_check_cache')||'null')}catch(e){}
   if(cached&&cached.version&&cached.checkedAt&&Date.now()-cached.checkedAt<24*60*60*1000){
    NV=normalizeReleaseVersion(cached.version);chkd=true;upd=compareVersions(NV,V)>0;uiUpd();
   }else{
    NV='';upd=false;chkd=false;uiUpd();
    try{localStorage.removeItem('dv_release_check_cache');localStorage.removeItem('dv_update_available_version')}catch(e){}
    if($('#uT'))$('#uT').textContent=t('off');
   }
  })
  .then(function(){if(b){b.disabled=false;b.classList.remove('loading')}updateCheckPromise=null});
 return updateCheckPromise;
}

function hidePayoffBootSplash(){
 var splash=document.getElementById('payoffBootSplash');
 if(!splash)return;
 function hideWebSplash(){
  var elapsed=Date.now()-(window.__payoffBootStartedAt||Date.now());
  window.setTimeout(function(){splash.classList.add('done');window.setTimeout(function(){if(splash.parentNode)splash.parentNode.removeChild(splash)},320)},Math.max(0,480-elapsed));
 }
 function waitForFirstWebFrames(){if(window.requestAnimationFrame)window.requestAnimationFrame(function(){window.requestAnimationFrame(hideWebSplash)});else window.setTimeout(hideWebSplash,80)}
 var nativeSplash=window.DividasNative&&window.DividasNative.SplashScreen;
 if(nativeSplash&&nativeSplash.hide)Promise.resolve(nativeSplash.hide()).then(waitForFirstWebFrames).catch(function(e){console.warn('Transição da abertura nativa:',e);waitForFirstWebFrames()});
 else waitForFirstWebFrames();
}

if('serviceWorker' in navigator&&!(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform()))navigator.serviceWorker.register('sw.js').catch(function(){});
